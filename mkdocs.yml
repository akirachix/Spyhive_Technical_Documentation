site_name: Bloom Technical Documentation
site_description: Technical documentation for the Bloom maternal health platform
site_author: Bloom Team

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Overview: overview.md
  - Informational Website: informational-website.md
  - Architecture: architecture.md
  - Backend: backend-api.md
  - Database: database.md
  - Security: security.md
  - Mobile: mobile.md
  - Dashboard: frontend-web.md
  - Design: design.md
  - QA & Testing: qa.md
  - Development: development.md
  - Integrations: integrations.md
  - Glossary: glossary.md